name: Bible API gate (no deploy or migrations)
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -e '.[test]'
      - name: Compile Python modules
        run: python -m compileall -q src
      - name: Test (local SQLite/memory only; PostgreSQL staging separate gate)
        env:
          BIBLE_ENVIRONMENT: local
          BIBLE_AUTH_MODE: demo
          BIBLE_BILLING_SANDBOX_CHECKOUT_ENABLED: "false"
          BIBLE_BILLING_WEBHOOK_SANDBOX_ENABLED: "false"
        run: python -m pytest -q
