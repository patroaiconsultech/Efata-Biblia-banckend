[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bible-api-efata777"
version = "0.14.0rc0"
description = "Bíblia Sagrada Digital — API independente"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.1,<4",
  "httpx>=0.27,<1",
  "cryptography>=42,<46",
  "PyJWT[crypto]>=2.8,<3",
  "argon2-cffi>=23.1,<26",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-asyncio>=0.23,<1", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
